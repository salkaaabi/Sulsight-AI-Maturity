<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 900" width="2100" height="900" role="img" aria-label="طلبة وطالبات في نشاط تعلّم مالي — إطار 21:9 بتقريب نصفي">
  <defs>
    <linearGradient id="sw" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F8F5EE"/><stop offset="100%" stop-color="#E9E3D6"/></linearGradient>
    <linearGradient id="swin" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#CDE1F1"/><stop offset="100%" stop-color="#EAF2F8"/></linearGradient>
    <linearGradient id="stbl" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E7DBC4"/><stop offset="100%" stop-color="#C9B896"/></linearGradient>
    <radialGradient id="sg" cx="50%" cy="6%" r="78%"><stop offset="0%" stop-color="#FFFAEE" stop-opacity=".95"/><stop offset="100%" stop-color="#FFFAEE" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="2100" height="900" fill="url(#sw)"/>
  <rect width="2100" height="900" fill="url(#sg)"/>

  <!-- نوافذ على الأطراف، خارج منطقة الوجوه -->
  <rect x="40" y="60" width="330" height="520" rx="12" fill="url(#swin)"/>
  <rect x="40" y="60" width="330" height="520" rx="12" fill="none" stroke="#D7CEBC" stroke-width="8"/>
  <path d="M205 60 v520 M40 320 h330" stroke="#D7CEBC" stroke-width="8"/>
  <rect x="1730" y="60" width="330" height="520" rx="12" fill="url(#swin)"/>
  <rect x="1730" y="60" width="330" height="520" rx="12" fill="none" stroke="#D7CEBC" stroke-width="8"/>
  <path d="M1895 60 v520 M1730 320 h330" stroke="#D7CEBC" stroke-width="8"/>

  <!-- لوح تعلّم خلف المجموعة -->
  <rect x="700" y="40" width="700" height="250" rx="14" fill="#12324F"/>
  <g fill="#fff" opacity=".2"><rect x="748" y="86" width="230" height="18" rx="9"/><rect x="748" y="122" width="150" height="14" rx="7"/></g>
  <g fill="#E8C878" opacity=".55">
    <rect x="748" y="186" width="56" height="74" rx="7"/><rect x="820" y="210" width="56" height="50" rx="7"/>
    <rect x="892" y="166" width="56" height="94" rx="7"/><rect x="964" y="196" width="56" height="64" rx="7"/>
  </g>
  <path d="M1076 240 L1148 198 L1220 218 L1292 164" stroke="#E8C878" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>

  <!-- الطاولة في الثلث السفلي — التكوين نصفي فتكبر الوجوه -->
  <rect x="0" y="770" width="2100" height="52" fill="url(#stbl)"/>
  <rect x="0" y="822" width="2100" height="78" fill="#BFB094"/>

  <!-- خمسة طلبة، الرؤوس عند 24%–34% من الارتفاع -->
  <g>
    <g transform="translate(560,770)">
      <path d="M-128 0 C-128 -196 -78 -272 0 -272 C78 -272 128 -196 128 0 Z" fill="#F5F3ED" stroke="#DCD4C3" stroke-width="7"/>
      <circle cx="0" cy="-350" r="88" fill="#E9E4D8" stroke="#D7CFBD" stroke-width="7"/>
      <path d="M-92 -352 a92 92 0 0 1 184 0 v56 q-92 26 -184 0 z" fill="#DCD5C5"/>
    </g>
    <g transform="translate(870,770)">
      <path d="M-124 0 C-124 -188 -76 -262 0 -262 C76 -262 124 -188 124 0 Z" fill="#26456A"/>
      <circle cx="0" cy="-338" r="86" fill="#33557C"/>
      <path d="M-90 -340 a90 90 0 0 1 180 0 v72 q-90 30 -180 0 z" fill="#1E3A5B"/>
      <rect x="-74" y="-96" width="148" height="72" rx="10" fill="#DFE7EE" opacity=".92"/>
    </g>
    <g transform="translate(1180,770)">
      <path d="M-120 0 C-120 -180 -74 -252 0 -252 C74 -252 120 -180 120 0 Z" fill="#7A5C3E"/>
      <circle cx="0" cy="-326" r="84" fill="#8D6E4D"/>
      <rect x="66" y="-120" width="84" height="96" rx="10" fill="#C9952A" opacity=".92"/>
    </g>
