      <circle cx="0" cy="-332" r="85" fill="#42728F"/>
      <path d="M-89 -334 a89 89 0 0 1 178 0 v68 q-89 28 -178 0 z" fill="#2A5069"/>
    </g>
  </g>

  <!-- أدوات على الطاولة -->
  <g>
    <rect x="360" y="726" width="150" height="44" rx="7" fill="#fff" opacity=".94"/>
    <rect x="1620" y="726" width="150" height="44" rx="7" fill="#fff" opacity=".94"/>
    <g transform="translate(990,700)"><rect width="170" height="70" rx="10" fill="#5C6B7A"/><rect x="11" y="11" width="148" height="48" rx="6" fill="#9FC2DE"/></g>
  </g>
</svg>
